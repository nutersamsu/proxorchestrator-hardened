{% load i18n %}
{% if t.running %}<span class="status-badge task-badge-running"><i class="fas fa-spinner fa-spin"></i> {% translate "running" %}</span>{% elif t.ok %}<span class="status-badge vm-status-running">{% translate "OK" %}</span>{% elif t.warning %}<span class="status-badge task-badge-warning" title="{{ t.status_text }}">{{ t.status_text|truncatechars:40 }}</span>{% else %}<span class="status-badge task-badge-error" title="{{ t.status_text }}">{{ t.status_text|truncatechars:40 }}</span>{% endif %}
