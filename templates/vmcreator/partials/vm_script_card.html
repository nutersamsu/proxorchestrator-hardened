{% load i18n %}
<div class="column is-4">
  <div class="cs-app-card"
       style="cursor:pointer;"
       onclick="openScriptModal(this)"
       data-name="{{ script.name }}"
       data-desc="{{ script.description }}"
       data-logo="{{ script.logo }}"
       data-slug="{{ script.slug }}"
       data-cpu="{{ script.defaults.cpu }}"
       data-ram="{{ script.defaults.ram }}"
       data-disk="{{ script.defaults.disk }}"
       data-os="{% if script.defaults.os %}{{ script.defaults.os }}{% if script.defaults.version %} {{ script.defaults.version }}{% endif %}{% else %}N/A{% endif %}"
       data-categories="{{ script.categories|join:', ' }}"
       data-deploy-url="{% url 'vm_community_scripts_deploy' script.slug %}"
       data-source-url="{{ script.source_url|default:'' }}"
       data-category-icon="{{ script.category_icon|default:'fas fa-server' }}">
    <div style="display:flex;align-items:flex-start;gap:0.85rem;">
      <img src="{{ script.logo }}"
           alt="{{ script.name }}"
           class="cs-app-logo"
           loading="lazy"
           onerror="this.style.display='none'; var fb=this.nextElementSibling; fb.style.display='flex'; fb.querySelector('i').className=this.closest('.cs-app-card').dataset.categoryIcon;">
      <div class="cs-app-logo-fallback" style="display:none;">
        <i class="{{ script.category_icon|default:'fas fa-server' }}"></i>
      </div>
      <div style="flex:1;min-width:0;">
        <div class="cs-app-name">{{ script.name }}</div>
        <div class="cs-app-desc">{{ script.description }}</div>
      </div>
    </div>
    <div class="cs-specs-grid">
      <div class="cs-spec"><span class="po-label"><i class="fas fa-microchip" aria-hidden="true"></i> {% translate "vCPU" %}</span><b>{{ script.defaults.cpu }}</b></div>
      <div class="cs-spec"><span class="po-label"><i class="fas fa-memory" aria-hidden="true"></i> {% translate "RAM" %}</span><b>{{ script.defaults.ram }} MB</b></div>
      <div class="cs-spec"><span class="po-label"><i class="fas fa-hard-drive" aria-hidden="true"></i> {% translate "Disk" %}</span><b>{{ script.defaults.disk }} GB</b></div>
    </div>
    <div class="cs-card-foot">
      <span class="cs-app-os po-mono po-truncate">{{ script.defaults.os }} {{ script.defaults.version }}</span>
      <a href="{% url 'vm_community_scripts_deploy' script.slug %}"
         class="button is-primary is-small"
         style="font-weight:600;"
         onclick="event.stopPropagation();">
        <span class="icon is-small"><i class="fas fa-rocket"></i></span>
        <span>{% translate "Deploy" %}</span>
      </a>
    </div>
  </div>
</div>
